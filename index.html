<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pharmaceutical CRM and Field Activity Management System for Medical Representatives.">
    <title>PharmaCare - Dashboard</title>

    <!-- Immediate synchronous theme execution to eliminate Flash of Light Theme (FOUC) -->
    <script>
        (function() {
            try {
                var theme = localStorage.getItem('pharmaTheme') || 'light';
                document.documentElement.setAttribute('data-theme', theme);
            } catch(e) {}
        })();
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="manifest" href="manifest.json">
    <!-- Core configuration and topbar logic loaded with defer -->
    <script defer src="js/firebase-config.js"></script>
    <script defer src="js/app.js"></script>
    <script defer src="js/store.js"></script>
</head>
<body>
    <div class="app">
        <!-- Sidebar Navigation (Drawer on mobile) -->
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">
            <!-- Unified Topbar Strip -->
            <header class="topbar" id="topbar">
                <script>if (typeof renderTopbar === 'function') renderTopbar();</script>
            </header>
            
            <!-- Main Content Area -->
            <div class="content" id="pageContent" style="padding-bottom: 60px;">
                <!-- Dynamically populated by dashboard.js based on authenticated role -->
            </div>
            
            <!-- Role Testing Switcher -->
            <div class="demo-switcher">
                <span data-i18n="demo_roles">Demo Roles:</span>
                <button onclick="if(window.switchDemoUser) window.switchDemoUser('admin')" class="btn">Admin</button>
                <button onclick="if(window.switchDemoUser) window.switchDemoUser('bu')" class="btn">BU</button>
                <button onclick="if(window.switchDemoUser) window.switchDemoUser('lm')" class="btn">LM</button>
                <button onclick="if(window.switchDemoUser) window.switchDemoUser('dm')" class="btn">DM</button>
                <button onclick="if(window.switchDemoUser) window.switchDemoUser('rep')" class="btn">Rep</button>
                <button onclick="if(window.switchDemoUser) window.switchDemoUser('hr')" class="btn" style="background: linear-gradient(135deg, #6f42c1, #593196); color: white;">HR</button>
            </div>
        </main>
    </div>

    <!-- Dashboard Visit Completion Modal -->
    <div class="modal-overlay" id="dashCompleteModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 2500; align-items: center; justify-content: center; backdrop-filter: blur(3px);">
      <div class="modal-box" id="dashModalCard" style="width: 90%; max-width: 490px; max-height: 90vh; overflow-y: auto; padding: 24px; pointer-events: auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--gray-200); padding-bottom: 12px;">
          <h4 id="dashModalTitle" style="margin: 0; font-weight: 700; font-size: 1.15rem;" data-i18n="convert_to_actual">Convert to Actual Visit</h4>
          <button type="button" onclick="closeDashCompleteModal()" style="border: none; background: none; font-size: 1.5rem; cursor: pointer; color: var(--gray-500); line-height: 1;">&times;</button>
        </div>
        <form id="dashCompleteForm" onsubmit="handleDashCompleteSubmit(event)">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;">
            <div class="form-group">
              <label style="display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.85rem;" id="lblDashDate">Execution Date</label>
              <input type="date" id="dashVisitDate" class="form-control" required style="width: 100%; padding: 8px 12px; border-radius: 8px;" onchange="updateDashModalDayDisplay()">
              <div id="dashModalDayDisplay" style="margin-top: 4px; font-size: 0.82rem; font-weight: 700; color: var(--primary);"></div>
            </div>
            <div class="form-group">
              <label style="display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.85rem;" id="lblDashTime" data-i18n="visit_time">Visit Time</label>
              <input type="time" id="dashVisitTime" class="form-control" required style="width: 100%; padding: 8px 12px; border-radius: 8px;">
            </div>
          </div>

          <div id="dashLockedDoubleBadge" style="display: none; margin-bottom: 14px; background: rgba(111,66,193,0.12); color: #6f42c1; border: 1px solid #6f42c1; padding: 10px 14px; border-radius: 8px; font-weight: 700; font-size: 0.88rem; align-items: center; gap: 8px;">
            <span style="font-size: 1.1rem;">🤝</span>
            <span id="dashLockedDoubleText">Accompanied Double Visit</span>
          </div>

          <div class="form-group" id="dashVisitTypeContainer" style="margin-bottom: 14px;">
            <label style="display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.85rem;" id="lblDashType" data-i18n="visit_type">Visit Type</label>
            <div style="display: flex; gap: 16px; align-items: center; font-size: 0.88rem;">
              <label style="display: inline-flex; align-items: center; gap: 6px; cursor: pointer;">
                <input type="radio" name="dashVisitType" value="single" checked onchange="toggleDashDoubleVisit()">
                <span id="lblDashSingle" data-i18n="single_visit">Single</span>
              </label>
              <label style="display: inline-flex; align-items: center; gap: 6px; cursor: pointer;">
                <input type="radio" name="dashVisitType" value="double" onchange="toggleDashDoubleVisit()">
                <span id="lblDashDouble" data-i18n="double_visit">Double</span>
              </label>
            </div>
          </div>

          <div class="form-group" id="dashDoubleSection" style="display: none; margin-bottom: 14px;">
            <label style="display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.85rem;" id="lblDashAccompanied" data-i18n="accompanied_by">Accompanied By</label>
            <div id="dashCompanionsContainer" style="display: flex; flex-wrap: wrap; gap: 8px;">
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 14px;">
            <label style="display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.85rem;" id="lblDashProducts" data-i18n="products_discussed">Products Discussed</label>
            <div id="dashProdContainer" style="display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; max-height: 140px; overflow-y: auto; padding-right: 4px;">
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 18px;">
            <label style="display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.85rem;" id="lblDashFeedback" data-i18n="visit_feedback">Visit Feedback</label>
            <textarea id="dashVisitComment" class="form-control" rows="2" placeholder="Enter visit feedback..." style="width: 100%; padding: 8px 12px; border-radius: 8px;"></textarea>
          </div>

          <div style="display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--gray-200); padding-top: 14px;">
            <button type="button" class="btn btn-secondary" onclick="closeDashCompleteModal()" data-i18n="cancel">Cancel</button>
            <button type="submit" class="btn btn-primary" id="btnDashSubmit" data-i18n="confirm_actual_visit">Confirm Actual Visit</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Scripts -->
    <script defer src="js/chart.umd.min.js"></script>
    <script defer src="js/interactive-charts.js"></script>
    <script defer src="js/reschedule.js"></script>
    <script defer src="js/dashboard.js"></script>
</body>
</html>
