<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/pharma-icon-192.png">
    <link rel="apple-touch-icon" href="images/pharma-icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="description" content="Pharmaceutical CRM and Field Activity Management System for Medical Representatives.">
    <title>PharmaCare - Dashboard</title>

    <!-- Immediate synchronous theme execution to eliminate Flash of Light Theme (FOUC) -->
    <script>
        (function() {
            try {
                var theme = localStorage.getItem('pharmaTheme') || 'light';
                document.documentElement.setAttribute('data-theme', theme);
            } catch(e) {}
        })();
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css?v=v282">
    <link rel="stylesheet" href="css/dashboard.css?v=v282">
    
    <!-- Centralized Cache Invalidation & Force Reload helper -->
    <script src="js/cache-bust.js?v=v282" defer></script>

    <!-- Core Application & Store -->
    <script src="js/auth-service.js?v=v282" defer></script>
  <script src="js/app.js?v=v282" defer></script>
    <script src="js/store.js?v=v282" defer></script>
    <!-- Firebase SDKs for Realtime Cloud Sync -->
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js" defer></script>
    <script src="js/firebase-config.js?v=v282" defer></script>
    <script src="js/firebase-sync.js?v=v282" defer></script>
</head>
<body>
    <div class="app">
        <!-- Sidebar Navigation (Drawer on mobile) -->
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">
            <!-- Unified Topbar Strip -->
            <header class="topbar" id="topbar">
                <script>if (typeof renderTopbar === 'function') renderTopbar();</script>
            </header>
            
            <!-- Main Content Area -->
            <div class="content" id="pageContent" style="padding-bottom: 60px;">
                <!-- Dynamically populated by dashboard.js based on authenticated role -->
            </div>
        </main>
    </div>

    <!-- Dashboard Visit Completion Modal -->
    <div class="modal-overlay dash-complete-modal-overlay" id="dashCompleteModal">
      <div class="modal-box dash-complete-modal-box" id="dashModalCard">
        <div class="dash-complete-header">
          <h4 id="dashModalTitle" class="dash-complete-title" data-i18n="convert_to_actual">Convert to Actual Visit</h4>
          <button type="button" onclick="closeDashCompleteModal()" class="dash-complete-close-btn">&times;</button>
        </div>
        <form id="dashCompleteForm" onsubmit="handleDashCompleteSubmit(event)">
          <div class="row g-2 mb-3">
            <div class="col-6 form-group">
              <label class="form-label fw-bold small" id="lblDashDate">Execution Date</label>
              <input type="date" id="dashVisitDate" class="form-control" required onchange="updateDashModalDayDisplay()">
              <div id="dashModalDayDisplay" class="mt-1 small fw-bold text-primary"></div>
            </div>
            <div class="col-6 form-group">
              <label class="form-label fw-bold small" id="lblDashTime" data-i18n="visit_time">Visit Time</label>
              <input type="time" id="dashVisitTime" class="form-control" required>
            </div>
          </div>

          <div id="dashLockedDoubleBadge" class="dash-locked-double-badge" style="display: none;">
            <svg class="header-svg-icon" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="1.85" fill="none" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span id="dashLockedDoubleText">Accompanied Double Visit</span>
          </div>

          <div class="form-group mb-3" id="dashVisitTypeContainer">
            <label class="form-label fw-bold small" id="lblDashType" data-i18n="visit_type">Visit Type</label>
            <div class="d-flex gap-3 align-items-center small">
              <label class="d-inline-flex align-items-center gap-1 cursor-pointer">
                <input type="radio" name="dashVisitType" value="single" checked onchange="toggleDashDoubleVisit()">
                <span id="lblDashSingle" data-i18n="single_visit">Single</span>
              </label>
              <label class="d-inline-flex align-items-center gap-1 cursor-pointer">
                <input type="radio" name="dashVisitType" value="double" onchange="toggleDashDoubleVisit()">
                <span id="lblDashDouble" data-i18n="double_visit">Double</span>
              </label>
            </div>
          </div>

          <div class="form-group mb-3" id="dashDoubleSection" style="display: none;">
            <label class="form-label fw-bold small" id="lblDashAccompanied" data-i18n="accompanied_by">Accompanied By</label>
            <div id="dashCompanionsContainer" class="d-flex flex-wrap gap-2">
            </div>
          </div>

          <div class="form-group mb-3">
            <label class="form-label fw-bold small" id="lblDashProducts" data-i18n="products_discussed">Products Discussed</label>
            <div id="dashProdContainer" class="dash-prod-container">
            </div>
          </div>

          <div class="form-group mb-3">
            <label class="form-label fw-bold small" id="lblDashSamples" data-i18n="giveaway_samples">Giveaway Samples</label>
            <input type="text" id="dashVisitGiveawaySamples" class="form-control" placeholder="e.g. 2 Packs, Pen, Note Pad...">
          </div>

          <div class="form-group mb-3">
            <label class="form-label fw-bold small" id="lblDashFeedback" data-i18n="visit_feedback">Visit Feedback</label>
            <textarea id="dashVisitComment" class="form-control" rows="2" placeholder="Enter visit feedback..."></textarea>
          </div>

          <div class="dash-complete-footer">
            <button type="button" class="btn btn-secondary px-3" onclick="closeDashCompleteModal()" data-i18n="cancel">Cancel</button>
            <button type="submit" class="btn btn-primary px-3 fw-bold" id="btnDashSubmit" data-i18n="confirm_actual_visit">Confirm Actual Visit</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Scripts -->
    <script defer src="js/chart.umd.min.js"></script>
    <script defer src="js/interactive-charts.js?v=v282"></script>
    <script defer src="js/reschedule.js?v=v282"></script>
    <script defer src="js/dashboard.js?v=v282"></script>
</body>
</html>
