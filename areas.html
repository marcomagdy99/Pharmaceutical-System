<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PharmaCare - Area Management</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("pharmaTheme") || "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet" />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cairo:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/areas.css" />
    <!-- Core configuration and topbar logic loaded in head for instant synchronous paint -->
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/store.js"></script>
  </head>
  <body>
    <div class="app">
      <!-- Sidebar Navigation -->
      <aside class="sidebar" id="sidebar"></aside>

      <!-- Main Content Area -->
      <main class="main-content">
        <!-- Top Navigation Bar & Brand Header -->
        <!-- Unified Topbar Strip -->
        <!-- Unified Topbar Strip -->
        <!-- Unified Topbar Strip -->
        <header class="topbar" id="topbar">
          <script>
            renderTopbar();
          </script>
        </header>

        <div class="content" id="pageContent" style="padding: 1.5rem">
          <!-- Page Header -->
          <div
            class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2"
          >
            <div>
              <h2 class="mb-1 fw-bold" data-i18n="area_management">
                Area Management
              </h2>
              <p class="text-muted mb-0">
                <span data-i18n="total_areas">Total Areas</span>:
                <span id="total-count-header">0</span>
              </p>
            </div>
            <div class="d-flex gap-2">
              <button
                class="btn btn-outline-primary shadow-sm px-3"
                data-bs-toggle="modal"
                data-bs-target="#areaModal"
                onclick="openAddModal()"
                id="manageAreaBtn"
              >
                <i class="fas fa-map-marked-alt me-2"></i
                ><span>Manage Area</span>
              </button>
              <button
                class="btn btn-primary shadow-sm px-4"
                data-bs-toggle="modal"
                data-bs-target="#areaModal"
                onclick="openAddModal()"
                id="addAreaBtn"
              >
                <i class="fas fa-plus me-2"></i
                ><span data-i18n="add_area">Add Area</span>
              </button>
            </div>
          </div>

          <!-- Stats Row -->
          <div class="row mb-4">
            <div class="col-md-4">
              <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body">
                  <div
                    class="d-flex justify-content-between align-items-center"
                  >
                    <div>
                      <h6 class="text-muted mb-2" data-i18n="total_areas">
                        Total Areas
                      </h6>
                      <h3 class="mb-0" id="stat-total">0</h3>
                    </div>
                    <div class="fs-1 text-primary">
                      <i class="fas fa-map-marked-alt"></i>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body">
                  <div
                    class="d-flex justify-content-between align-items-center"
                  >
                    <div>
                      <h6 class="text-muted mb-2" data-i18n="assigned_areas">
                        Assigned Areas
                      </h6>
                      <h3 class="mb-0 text-success" id="stat-assigned">0</h3>
                    </div>
                    <div class="fs-1 text-success">
                      <i class="fas fa-check-circle"></i>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body">
                  <div
                    class="d-flex justify-content-between align-items-center"
                  >
                    <div>
                      <h6 class="text-muted mb-2" data-i18n="unassigned_areas">
                        Unassigned Areas
                      </h6>
                      <h3 class="mb-0 text-secondary" id="stat-unassigned">
                        0
                      </h3>
                    </div>
                    <div class="fs-1 text-secondary">
                      <i class="fas fa-times-circle"></i>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Filter Bar -->
          <div class="card border-0 shadow-sm rounded-4 mb-4">
            <div class="card-body">
              <div class="row align-items-center">
                <div class="col-md-6">
                  <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"
                      ><i class="fas fa-search text-muted"></i
                    ></span>
                    <input
                      type="text"
                      class="form-control border-start-0"
                      id="search-input"
                      data-i18n-placeholder="search_areas"
                      placeholder="Search by name or code..."
                      oninput="filterAreas()"
                    />
                  </div>
                </div>
                <div class="col-md-6 text-md-end mt-3 mt-md-0">
                  <div class="btn-group" role="group">
                    <input
                      type="radio"
                      class="btn-check"
                      name="viewToggle"
                      id="tableViewBtn"
                      autocomplete="off"
                      checked
                      onchange="toggleView('table')"
                    />
                    <label class="btn btn-outline-secondary" for="tableViewBtn"
                      ><i class="fas fa-table"></i
                    ></label>

                    <input
                      type="radio"
                      class="btn-check"
                      name="viewToggle"
                      id="cardsViewBtn"
                      autocomplete="off"
                      onchange="toggleView('cards')"
                    />
                    <label class="btn btn-outline-secondary" for="cardsViewBtn"
                      ><i class="fas fa-th-large"></i
                    ></label>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Table View -->
          <div id="table-view" class="card border-0 shadow-sm rounded-4 mb-4">
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead class="bg-light">
                    <tr>
                      <th class="border-0 px-4 py-3" data-i18n="area_code">
                        Area Code
                      </th>
                      <th class="border-0 px-4 py-3" data-i18n="area_name">
                        Area Name
                      </th>
                      <th class="border-0 px-4 py-3" data-i18n="assigned_rep">
                        Assigned Rep
                      </th>
                      <th class="border-0 px-4 py-3" data-i18n="status">
                        Status
                      </th>
                      <th
                        class="border-0 px-4 py-3 text-end"
                        data-i18n="actions"
                      >
                        Actions
                      </th>
                    </tr>
                  </thead>
                  <tbody id="areas-table-body">
                    <!-- Populated by JS -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- Cards View -->
          <div id="cards-view" class="row g-4 mb-4">
            <!-- Populated by JS -->
          </div>
        </div>
      </main>
    </div>

    <!-- Add/Edit Area Modal -->
    <div class="modal fade" id="areaModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 border-0 shadow">
          <div class="modal-header border-bottom py-3">
            <h5 class="modal-title" id="areaModalTitle" data-i18n="add_area">
              Add Area
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="areaForm">
              <input type="hidden" id="areaId" />

              <div class="mb-3">
                <label class="form-label fw-semibold" data-i18n="area_name"
                  >Area Name <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  class="form-control"
                  id="areaName"
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold" data-i18n="area_code"
                  >Area Code <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  class="form-control text-uppercase"
                  id="areaCode"
                  placeholder="e.g. CAI-N01"
                  required
                />
                <div class="form-text" data-i18n="area_code_hint">
                  Format hint: CAI-N01. Must be unique.
                </div>
              </div>

              <div class="mb-3">
                <label
                  class="form-label fw-semibold"
                  data-i18n="assigned_representative"
                  >Assigned Representative</label
                >
                <select class="form-select" id="assignRep">
                  <option value="" data-i18n="unassigned">
                    -- Unassigned --
                  </option>
                </select>
              </div>
            </form>
          </div>
          <div class="modal-footer border-top py-3">
            <button
              type="button"
              class="btn btn-light"
              data-bs-dismiss="modal"
              data-i18n="cancel"
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="saveArea()"
              data-i18n="save"
            >
              Save
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
      <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content rounded-4 border-0 shadow">
          <div class="modal-body text-center p-4">
            <div class="mb-3 text-danger fs-1">
              <i class="fas fa-exclamation-circle"></i>
            </div>
            <h5 class="mb-3" data-i18n="confirm_delete">Confirm Delete</h5>
            <p class="text-muted mb-4" data-i18n="delete_area_msg">
              Are you sure you want to delete this area?
            </p>
            <input type="hidden" id="deleteAreaId" />
            <div class="d-flex justify-content-center gap-2">
              <button
                type="button"
                class="btn btn-light"
                data-bs-dismiss="modal"
                data-i18n="cancel"
              >
                Cancel
              </button>
              <button
                type="button"
                class="btn btn-danger"
                onclick="confirmDelete()"
                data-i18n="delete"
              >
                Delete
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/areas.js"></script>
  </body>
</html>
