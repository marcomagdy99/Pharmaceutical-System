<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCare - Visits</title>

    <!-- Immediate synchronous theme execution to eliminate Flash of Light Theme -->
    <script>
        (function() {
            try {
                var theme = localStorage.getItem('pharmaTheme') || 'light';
                document.documentElement.setAttribute('data-theme', theme);
            } catch(e) {}
        })();
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/visits.css">
  <!-- Core configuration and topbar logic loaded in head for instant synchronous paint -->
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
    <script src="js/store.js"></script>
</head>
<body>
    <div class="app">
        <!-- Sidebar Navigation (Drawer on mobile) -->
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">
                  <!-- Unified Topbar Strip -->
      <header class="topbar" id="topbar">
        <script>renderTopbar();</script>
      </header>

            <div class="content" id="pageContent">
                
                <div class="visits-header">
                    <div class="visits-title">
                        <svg class="visits-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                        <span id="visitsPageTitle" data-i18n="tabDailyTimeline">Daily Visits Timeline</span>
                    </div>
                    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="toggleCompanyGpsPolicy()" id="adminGpsPolicyBtn" style="display: none;" title="Toggle Company GPS Enforcement Policy">
                            📍 <span id="adminGpsPolicyLabel">GPS: Active</span>
                        </button>
                        <button class="btn btn-outline" onclick="exportVisitsToCSV()" id="exportVisitsBtn" title="Export to CSV/Excel">
                            📥 <span data-i18n="btnExportCSV">Export CSV</span>
                        </button>
                        <button class="btn btn-outline" onclick="printVisitsReport()" id="printVisitsBtn" title="Print Visits">
                            🖨️ <span data-i18n="btnPrint">Print</span>
                        </button>
                        <button class="btn btn-outline" onclick="openBulkPlanModal()" id="planVisitBtn">
                            🗓️ <span data-i18n="planVisit">Plan Visits (Bulk)</span>
                        </button>
                        <button class="btn btn-primary" onclick="openVisitModal(true)" id="addActualVisitBtn" data-i18n="logActualVisit">
                            📍 Log Actual Visit
                        </button>
                    </div>
                </div>

                <!-- Manager Filter Bar (Product Line & Team Filters) -->
                <div id="managerFilterBar" class="manager-rep-filter-container" style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap;">
                    <div id="managerLineFilterContainer" style="display: flex; align-items: center; gap: 8px;">
                        <label for="filterLine" class="manager-rep-filter-label" style="margin-bottom: 0;">
                            <span>📦</span> <span data-i18n="lineFilterLabel">Product Line:</span>
                        </label>
                        <select id="filterLine" class="filter-input" style="min-width: 180px; height: 38px; font-weight: 500;" onchange="onVisitsLineFilterChange(this.value)">
                            <option value="all" data-i18n="allLines">All Lines</option>
                        </select>
                    </div>
                    <div id="managerRepFilterContainer" style="display: flex; align-items: center; gap: 8px; flex: 1; min-width: 260px;">
                        <label for="filterRep" class="manager-rep-filter-label" style="margin-bottom: 0;">
                            <span>👥</span> <span data-i18n="teamFilterLabel">Team Filter:</span>
                        </label>
                        <select id="filterRep" class="filter-input" style="min-width: min(300px, 100%); max-width: 100%; height: 38px; font-weight: 500;" onchange="onVisitsRepFilterChange(this.value)">
                            <option value="all" data-i18n="allReps">All Team (DMs & Med Reps)</option>
                        </select>
                    </div>
                </div>
                
                <!-- Daily Visits Timeline Main View -->
                <div class="timeline-main-panel active" id="tab-timeline">
                    <div class="timeline-filter-card">
                        <div class="timeline-filter-form-grid">
                            <div class="timeline-filter-field col-date">
                                <label class="timeline-filter-label" for="timelineDatePicker" data-i18n="timelineSelectDate">Select Date:</label>
                                <input type="date" id="timelineDatePicker" class="form-control filter-input">
                            </div>
                            <div class="timeline-filter-field col-area">
                                <label class="timeline-filter-label" for="timelineAreaFilter">
                                    <span>📍</span> <span data-i18n="filterArea">Area:</span>
                                </label>
                                <select id="timelineAreaFilter" class="form-control filter-input">
                                    <option value="all" data-i18n="allAreas">All Areas</option>
                                </select>
                            </div>
                            <div class="timeline-filter-field col-period">
                                <label class="timeline-filter-label" for="timelinePeriodFilter">
                                    <span>⏰</span> <span data-i18n="filterPeriod">Period:</span>
                                </label>
                                <select id="timelinePeriodFilter" class="form-control filter-input">
                                    <option value="all" data-i18n="allPeriods">All Periods</option>
                                    <option value="am" data-i18n="periodAM">AM (Hospitals)</option>
                                    <option value="pm" data-i18n="periodPM">PM (Doctors)</option>
                                    <option value="pharmacy" data-i18n="periodPharm">Pharmacy</option>
                                </select>
                            </div>
                            <div class="timeline-filter-field col-status">
                                <label class="timeline-filter-label" for="timelineStatusFilter">
                                    <span>📊</span> <span data-i18n="filterStatus">Status:</span>
                                </label>
                                <select id="timelineStatusFilter" class="form-control filter-input">
                                    <option value="all" data-i18n="allStatuses">All Statuses</option>
                                    <option value="actual" data-i18n="statusExecuted">Executed / Actual</option>
                                    <option value="plan" data-i18n="statusPlannedOnly">Planned</option>
                                </select>
                            </div>
                            <div class="timeline-filter-field col-btn">
                                <button type="button" class="btn btn-primary" id="btnShowVisits" onclick="renderVisitsTimeline(true)">
                                    🔍 <span data-i18n="btnShow">Show</span>
                                </button>
                            </div>
                        </div>
                        <div class="legend-box" style="margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap;">
                            <span class="legend-item">
                                <span class="legend-dot actual"></span> 
                                <span data-i18n="directActual">Direct Actual Visit</span>
                            </span>
                            <span class="legend-item">
                                <span class="legend-dot planned"></span> 
                                <span data-i18n="plannedExecuted">Planned & Executed</span>
                            </span>
                            <span class="legend-item">
                                <span class="legend-dot joint"></span> 
                                <span data-i18n="jointVisitBadge">Joint Visit (Co-Visiting)</span>
                            </span>
                        </div>
                    </div>

                    <div class="timeline-summary-bar" id="timelineSummaryBar"></div>
                    <div class="timeline-container" id="timelineEventsContainer"></div>
                </div>

            </div>
        </main>
    </div>
    
    <!-- Fast Bulk Plan Visits Modal -->
    <div class="modal" id="bulkPlanModal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <div class="modal-title" style="font-weight: 700; font-size: 1.25rem;">🗓️ Plan Visits (Multi-Select)</div>
                <button class="close-btn" onclick="closeBulkPlanModal()">&times;</button>
            </div>
            
            <div class="bulk-plan-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1rem;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label class="form-label" data-i18n="modalDate">Planning Date</label>
                    <input type="date" id="bulkPlanDate" class="form-control">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label class="form-label" data-i18n="modalPeriod">Period</label>
                    <div class="radio-group" style="margin-top: 6px;">
                        <label class="radio-label">
                            <input type="radio" name="bulkPeriod" value="am" onchange="renderBulkTargetsList()"> 
                            <span data-i18n="modalAM">AM (Hospitals)</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="bulkPeriod" value="pm" checked onchange="renderBulkTargetsList()"> 
                            <span data-i18n="modalPM">PM (Doctors)</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="bulk-search-bar" style="margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap;">
                <input type="text" id="bulkSearchInput" class="form-control" style="flex: 1; min-width: 160px;" placeholder="Search doctor by name or specialty..." oninput="filterBulkTargetsList()">
                <select id="bulkAreaFilter" class="form-control" style="max-width: 160px;" onchange="filterBulkTargetsList()">
                    <option value="all" data-i18n="allAreas">All Areas</option>
                </select>
                <select id="bulkClassFilter" class="form-control" style="max-width: 130px;" onchange="filterBulkTargetsList()">
                    <option value="all">All Classes</option>
                    <option value="A">Class A Only</option>
                    <option value="B">Class B Only</option>
                </select>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.85rem;">
                <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 700;">
                    <input type="checkbox" id="bulkSelectAllToggle" onchange="toggleBulkSelectAll(this.checked)">
                    <span data-i18n="selectAll">Select All</span>
                </label>
                <span id="bulkSelectionCounter" class="badge" style="background: var(--primary-light); color: var(--primary); font-weight: 700; padding: 4px 10px; border-radius: 12px;">
                    Selected: 0 Targets
                </span>
            </div>

            <div class="bulk-targets-list" id="bulkTargetsContainer"></div>

            <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem; border-top: 1px solid var(--gray-200); padding-top: 1rem;">
                <button class="btn btn-secondary" onclick="closeBulkPlanModal()" data-i18n="btnCancel">Cancel</button>
                <button class="btn btn-primary" id="btnSaveBulkPlan" onclick="saveBulkPlanVisits()">
                    Save Planned Visits
                </button>
            </div>
        </div>
    </div>

    <!-- Add/Complete Single Visit Modal -->
    <div class="modal" id="visitModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="visitModalTitle" data-i18n="modalAddVisit">Add New Visit</div>
                <button class="close-btn" onclick="closeVisitModal()">&times;</button>
            </div>
            <div class="visit-modal-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="form-group">
                    <label class="form-label" data-i18n="modalDate">Date</label>
                    <input type="date" id="visitDate" class="form-control" onchange="updateVisitModalDayDisplay()">
                    <div id="visitModalDayName" style="margin-top: 4px; font-size: 0.82rem; font-weight: 700; color: var(--primary);"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">Visit Time (HH:MM)</label>
                    <input type="time" id="visitTime" class="form-control">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" id="visitTargetTypeLabel" data-i18n="modalPeriod">Target Type / Period</label>
                <div class="radio-group" id="visitPeriodRadioGroup">
                    <label class="radio-label"><input type="radio" name="visitPeriod" value="am" onchange="updateTargetOptions()"> <span data-i18n="modalAM">AM (Hospital)</span></label>
                    <label class="radio-label"><input type="radio" name="visitPeriod" value="pm" checked onchange="updateTargetOptions()"> <span data-i18n="modalPM">PM (Doctor)</span></label>
                    <label class="radio-label" id="radioPharmacyLabel"><input type="radio" name="visitPeriod" value="pharmacy" onchange="updateTargetOptions()"> <span data-i18n="modalPharmacy">💊 Pharmacy</span></label>
                </div>
            </div>
            <div class="form-group" id="modalTargetFilterContainer" style="display: none;">
                <label class="form-label" id="modalTargetFilterLabel" data-i18n="modalFilterDoctor">Filter Doctor by Team Member</label>
                <select id="modalTargetFilterSelect" class="form-control" onchange="updateTargetOptions()"></select>
            </div>
            <div class="form-group">
                <label class="form-label" id="visitTargetLabel" data-i18n="modalTarget">Doctor/Hospital</label>
                <select id="visitTarget" class="form-control" onchange="onVisitTargetChange()"></select>
            </div>

            <!-- GPS Geofencing Verification Card (Controlled by Admin Policy) -->
            <div class="form-group" id="visitGpsSection" style="display: none; margin-bottom: 14px;">
                <div style="background: var(--surface-hover, #f8fafc); border: 1px solid var(--border-color, #e2e8f0); border-radius: 10px; padding: 12px 14px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 6px;">
                        <label style="margin: 0; font-weight: 700; font-size: 0.88rem; display: flex; align-items: center; gap: 6px; color: var(--gray-800);">
                            <span>📍</span>
                            <span id="lblVisitGpsTitle" data-i18n="modalGpsTitle">GPS Geofencing Verification</span>
                        </label>
                        <span id="visitGpsBadge" class="badge" data-i18n="gpsBadgePending" style="background: #e2e8f0; color: #475569; font-size: 0.75rem; padding: 3px 10px; border-radius: 999px; font-weight: 700;">
                            Pending Check
                        </span>
                    </div>
                    <div id="visitGpsInfoText" data-i18n="gpsInfoDefault" style="font-size: 0.8rem; color: var(--gray-600); margin-bottom: 8px;">
                        Verifying your presence within the clinic geofence radius (200m).
                    </div>
                    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                        <button type="button" class="btn btn-outline" id="btnCheckMyGps" onclick="triggerManualGpsCheck()" style="padding: 4px 12px; font-size: 0.8rem; font-weight: 600; border-radius: 6px;">
                            <span data-i18n="btnCheckGps">📡 Check Location Now</span>
                        </button>
                        <span id="visitGpsDistanceText" style="font-size: 0.82rem; font-weight: 700; color: var(--primary);"></span>
                    </div>
                </div>
            </div>

            <div class="form-group" id="visitTypeSection">
                <label class="form-label" data-i18n="modalType">Visit Type</label>
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="visitType" value="single" checked onchange="toggleDoubleVisit()"> <span data-i18n="modalSingle">Single</span></label>
                    <label class="radio-label"><input type="radio" name="visitType" value="double" onchange="toggleDoubleVisit()"> <span data-i18n="modalDouble">Double</span></label>
                </div>
            </div>
            <div class="form-group" id="doubleManagerSection" style="display: none;">
                <label class="form-label" data-i18n="modalSelectManager">Accompanied By (Select Companion(s))</label>
                <div class="checkbox-group" id="visitManagersGroup" style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px;">
                </div>
            </div>
            
<div class="form-group" id="productsSection">
    <label class="form-label" data-i18n="modalProducts">Products Discussed</label>
    <div class="checkbox-group" id="visitProducts">
    </div>
</div>
<div class="form-group" id="giveawaySamplesSection">
    <label class="form-label" id="labelGiveawaySamples" data-i18n="modalGiveawaySamples">Giveaway Samples</label>
    <input type="text" id="visitGiveawaySamples" class="form-control" placeholder="e.g. 2 Packs, Pen, Note Pad...">
</div>
<div class="form-group">
                <label class="form-label" data-i18n="modalComment">Comment</label>
                <textarea id="visitComment" class="form-control" rows="3"></textarea>
            </div>
            <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                <button class="btn btn-secondary" onclick="closeVisitModal()" data-i18n="btnCancel">Cancel</button>
                <button class="btn btn-primary" id="btnSaveVisit" onclick="saveVisit()" data-i18n="btnSaveVisit">Save Visit</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/reschedule.js"></script>
    <script src="js/visits.js"></script>
</body>
</html>
