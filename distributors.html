<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PharmaCare - Distributor Management</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("pharmaTheme") || "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet" />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cairo:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Reuses the Areas page's card/table styling (same visual language:
         area-code-badge, avatar-circle, etc.) so Distributors looks and
         behaves consistently without a brand-new stylesheet. -->
    <link rel="stylesheet" href="css/areas.css" />
    <!-- Core configuration and topbar logic loaded in head for instant synchronous paint -->
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/store.js"></script>
  </head>
  <body>
    <div class="app">
      <!-- Sidebar Navigation -->
      <aside class="sidebar" id="sidebar"></aside>

      <!-- Main Content Area -->
      <main class="main-content">
        <!-- Unified Topbar Strip -->
        <header class="topbar" id="topbar">
          <script>
            renderTopbar();
          </script>
        </header>

        <div class="content" id="pageContent" style="padding: 1.5rem">
          <!-- Page Header -->
          <div
            class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2"
          >
            <div>
              <h2 class="mb-1 fw-bold" data-i18n="distributor_management">
                Distributor Management
              </h2>
              <p class="text-muted mb-0">
                <span data-i18n="total_distributors">Total Distributors</span>:
                <span id="total-count-header">0</span>
              </p>
            </div>
            <div class="d-flex gap-2">
              <button
                class="btn btn-primary shadow-sm px-4"
                data-bs-toggle="modal"
                data-bs-target="#distributorModal"
                onclick="openAddModal()"
                id="addDistributorBtn"
              >
                <i class="fas fa-plus me-2"></i
                ><span data-i18n="add_distributor">Add Distributor</span>
              </button>
            </div>
          </div>

          <!-- Stats Row -->
          <div class="row mb-4">
            <div class="col-md-4">
              <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body">
                  <div
                    class="d-flex justify-content-between align-items-center"
                  >
                    <div>
                      <h6
                        class="text-muted mb-2"
                        data-i18n="total_distributors"
                      >
                        Total Distributors
                      </h6>
                      <h3 class="mb-0" id="stat-total">0</h3>
                    </div>
                    <div class="fs-1 text-primary">
                      <i class="fas fa-truck"></i>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Filter Bar -->
          <div class="card border-0 shadow-sm rounded-4 mb-4">
            <div class="card-body">
              <div class="row align-items-center">
                <div class="col-md-6">
                  <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"
                      ><i class="fas fa-search text-muted"></i
                    ></span>
                    <input
                      type="text"
                      class="form-control border-start-0"
                      id="search-input"
                      data-i18n-placeholder="search_distributors"
                      placeholder="Search by name..."
                      oninput="filterDistributors()"
                    />
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Table View -->
          <div id="table-view" class="card border-0 shadow-sm rounded-4 mb-4">
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead class="bg-light">
                    <tr>
                      <th
                        class="border-0 px-4 py-3"
                        data-i18n="distributor_name"
                      >
                        Distributor Name
                      </th>
                      <th
                        class="border-0 px-4 py-3 text-end"
                        data-i18n="actions"
                      >
                        Actions
                      </th>
                    </tr>
                  </thead>
                  <tbody id="distributors-table-body">
                    <!-- Populated by JS -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- Empty State -->
          <div
            id="empty-state"
            class="card border-0 shadow-sm rounded-4 mb-4 text-center py-5"
            style="display: none"
          >
            <div class="fs-1 text-muted mb-2">
              <i class="fas fa-truck"></i>
            </div>
            <h5 class="text-muted" data-i18n="no_distributors_found">
              No Distributors Found
            </h5>
            <p class="text-muted mb-0" data-i18n="no_distributors_desc">
              Add your first distributor to start mapping their sales sheets.
            </p>
          </div>
        </div>
      </main>
    </div>

    <!-- Add/Edit Distributor Modal -->
    <div class="modal fade" id="distributorModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 border-0 shadow">
          <div class="modal-header border-bottom py-3">
            <h5
              class="modal-title"
              id="distributorModalTitle"
              data-i18n="add_distributor"
            >
              Add Distributor
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="distributorForm">
              <input type="hidden" id="distributorId" />

              <div class="mb-3">
                <label
                  class="form-label fw-semibold"
                  data-i18n="distributor_name"
                  >Distributor Name <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  class="form-control"
                  id="distributorName"
                  placeholder="e.g. Ibn Sina"
                  required
                />
              </div>
            </form>
          </div>
          <div class="modal-footer border-top py-3">
            <button
              type="button"
              class="btn btn-light"
              data-bs-dismiss="modal"
              data-i18n="cancel"
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="saveDistributor()"
              data-i18n="save"
            >
              Save
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
      <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content rounded-4 border-0 shadow">
          <div class="modal-body text-center p-4">
            <div class="mb-3 text-danger fs-1">
              <i class="fas fa-exclamation-circle"></i>
            </div>
            <h5 class="mb-3" data-i18n="confirm_delete">Confirm Delete</h5>
            <p class="text-muted mb-4" data-i18n="delete_distributor_msg">
              Are you sure you want to delete this distributor?
            </p>
            <input type="hidden" id="deleteDistributorId" />
            <div class="d-flex justify-content-center gap-2">
              <button
                type="button"
                class="btn btn-light"
                data-bs-dismiss="modal"
                data-i18n="cancel"
              >
                Cancel
              </button>
              <button
                type="button"
                class="btn btn-danger"
                onclick="confirmDelete()"
                data-i18n="delete"
              >
                Delete
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/distributors.js"></script>
  </body>
</html>
