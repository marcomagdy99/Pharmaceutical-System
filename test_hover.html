<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="dm-schedule-nav-btn">
  <a id="testLink" href="plans-review.html" class="btn btn-sm btn-primary">
    📋 <span>Review Plans & Schedule Accompaniment</span>
  </a>
</div>
<script>
window.addEventListener('load', () => {
  const link = document.getElementById('testLink');
  const span = link.querySelector('span');

  // Normal computed styles
  const normalLinkColor = window.getComputedStyle(link).color;
  const normalSpanColor = window.getComputedStyle(span).color;
  const normalBg = window.getComputedStyle(link).backgroundColor;

  console.log('NORMAL:', JSON.stringify({ linkColor: normalLinkColor, spanColor: normalSpanColor, bg: normalBg }));
});
</script>
</body>
</html>
