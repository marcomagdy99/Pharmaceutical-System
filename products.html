<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="productLinesTitle">Product Lines - PharmaCare</title>
        <!-- Immediate synchronous theme execution to eliminate Flash of Light Theme (FOUC) -->
    <script>
        (function() {
            try {
                var theme = localStorage.getItem('pharmaTheme') || 'light';
                document.documentElement.setAttribute('data-theme', theme);
            } catch(e) {}
        })();
    </script>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/products.css">
  <!-- Core configuration and topbar logic loaded in head for instant synchronous paint -->
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
    <div class="app">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar"></aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Top Navigation Bar & Brand Header -->
      <!-- Unified Topbar Strip -->
      <header class="topbar" id="topbar">
        <script>renderTopbar();</script>
      </header>

            <div class="content" id="pageContent" style="padding: 1.5rem;">
                <div class="container-fluid px-0 pb-5">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold mb-0" data-i18n="productLinesHeader">Product Lines</h2>
                <button class="btn btn-primary shadow-sm" id="add-line-btn" data-bs-toggle="modal" data-bs-target="#lineModal">
                    <i class="bi bi-plus-lg"></i> <span data-i18n="addProductLine">Add Product Line</span>
                </button>
            </div>

            <!-- Accordion Container -->
            <div class="accordion shadow-sm" id="productLinesAccordion" style="border-radius: 14px; overflow: hidden;">
                <!-- Dynamically populated via JS -->
            </div>
        </div>
    </div>
</main>
</div>

<!-- Modals -->

<!-- Add/Edit Line Modal -->
<div class="modal fade" id="lineModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content product-card">
            <div class="modal-header border-bottom py-3">
                <h5 class="modal-title fw-bold" id="lineModalTitle" data-i18n="addProductLine">Add Product Line</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body py-3">
                <form id="lineForm">
                    <input type="hidden" id="lineId">
                    <div class="mb-3">
                        <label class="form-label fw-semibold" data-i18n="lineName">Line Name</label>
                        <input type="text" class="form-control" id="lineName" required data-i18n-placeholder="lineNamePlaceholder" placeholder="Enter line name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" data-i18n="assignManager">Assign Line Manager</label>
                        <select class="form-select" id="lineManager" required>
                            <!-- Populated via JS -->
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer border-top py-3">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal" data-i18n="cancel">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveLineBtn" data-i18n="save">Save</button>
            </div>
        </div>
    </div>
</div>

<!-- Add/Edit Product Modal -->
<div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content product-card">
            <div class="modal-header border-bottom py-3">
                <h5 class="modal-title fw-bold" id="productModalTitle" data-i18n="addProduct">Add Product</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body py-3">
                <form id="productForm">
                    <input type="hidden" id="targetLineId">
                    <input type="hidden" id="productId">
                    <div class="mb-3">
                        <label class="form-label fw-semibold" data-i18n="productName">Product Name</label>
                        <input type="text" class="form-control" id="productName" required data-i18n-placeholder="productNamePlaceholder" placeholder="Enter product name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" data-i18n="dosage">Dosage</label>
                        <input type="text" class="form-control" id="productDosage" required data-i18n-placeholder="dosagePlaceholder" placeholder="e.g., 500mg">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" data-i18n="form">Form</label>
                        <select class="form-select" id="productFormSelect" required>
                            <option value="Tablet" data-i18n="tablet">Tablet</option>
                            <option value="Capsule" data-i18n="capsule">Capsule</option>
                            <option value="Drops" data-i18n="drops">Drops</option>
                            <option value="Syrup" data-i18n="syrup">Syrup</option>
                            <option value="Injection" data-i18n="injection">Injection</option>
                            <option value="Cream" data-i18n="cream">Cream</option>
                            <option value="Other" data-i18n="other">Other</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" data-i18n="description">Description (Optional)</label>
                        <textarea class="form-control" id="productDescription" rows="3" data-i18n-placeholder="descriptionPlaceholder" placeholder="Enter product description"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer border-top py-3">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal" data-i18n="cancel">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveProductBtn" data-i18n="save">Save</button>
            </div>
        </div>
    </div>
</div>

<!-- Transfer Product Modal -->
<div class="modal fade" id="transferProductModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content product-card">
            <div class="modal-header border-bottom py-3">
                <h5 class="modal-title fw-bold" data-i18n="transferProduct"><i class="bi bi-arrow-left-right me-2 text-primary"></i>Transfer Product</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body py-3">
                <form id="transferProductForm">
                    <input type="hidden" id="transferSourceLineId">
                    <input type="hidden" id="transferProductId">

                    <div class="mb-3">
                        <label class="form-label fw-semibold" data-i18n="productName">Product Name</label>
                        <input type="text" class="form-control" id="transferProductName" readonly disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold" data-i18n="currentLine">Current Line</label>
                        <input type="text" class="form-control" id="transferCurrentLineName" readonly disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold" data-i18n="destinationLine">Transfer To Line <span class="text-danger">*</span></label>
                        <select class="form-select" id="transferTargetLineSelect" required>
                            <!-- Populated dynamically via JS -->
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer border-top py-3">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal" data-i18n="cancel">Cancel</button>
                <button type="button" class="btn btn-primary" id="confirmTransferBtn" onclick="confirmTransferProduct()" data-i18n="confirmTransfer">Transfer Product</button>
            </div>
        </div>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content product-card border-danger">
            <div class="modal-header border-bottom py-3 bg-danger text-white" style="border-radius: 14px 14px 0 0;">
                <h5 class="modal-title" data-i18n="confirmDelete">Confirm Delete</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center py-4">
                <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
                <p class="mt-3 mb-0" id="deleteMessage" data-i18n="deleteConfirmMessage">Are you sure you want to delete this item? This action cannot be undone.</p>
                <input type="hidden" id="deleteTargetId">
                <input type="hidden" id="deleteTargetLineId">
                <input type="hidden" id="deleteTargetType"> <!-- 'line' or 'product' -->
            </div>
            <div class="modal-footer border-top py-3">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal" data-i18n="cancel">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn" data-i18n="delete">Delete</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Firebase Config (mock) -->
<!-- Main App JS (mock logic/auth/i18n) -->
<!-- Products Page JS -->
<script src="js/store.js"></script>
<script src="js/products.js"></script>
</body>
</html>
